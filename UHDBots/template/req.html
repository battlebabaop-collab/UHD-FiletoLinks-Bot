<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch {{file_name}} - PikaShow</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Hkwyv5m9/upscalemedia-transformed.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Hkwyv5m9/upscalemedia-transformed.png">
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d12; color: #E5E5E5; margin: 0; overflow-x: hidden; }
        .neon-blue-outline { color: transparent; -webkit-text-stroke: 1px #00b4d8; }
        .neon-green-outline { color: transparent; -webkit-text-stroke: 1px #ccff00; }
        
        /* PikaShow Glowing Background */
        .glowing-orb-1 { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(204,255,0,0.15) 0%, rgba(0,0,0,0) 70%); top: -50px; left: -50px; border-radius: 50%; pointer-events: none; z-index: 0; }
        .glowing-orb-2 { position: fixed; width: 250px; height: 250px; background: radial-gradient(circle, rgba(0,180,216,0.15) 0%, rgba(0,0,0,0) 70%); bottom: -50px; right: -50px; border-radius: 50%; pointer-events: none; z-index: 0; }
        
        /* Video Container Styling */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 16px; border: 1px solid rgba(204,255,0,0.3); box-shadow: 0 15px 40px rgba(0,0,0,0.7); z-index: 10; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    
    <!-- Background Glow -->
    <div class="glowing-orb-1"></div>
    <div class="glowing-orb-2"></div>

    <!-- PikaShow Header -->
    <header class="w-full bg-[#0a0a0f]/95 backdrop-blur-md border-b border-gray-800 py-3 px-4 flex justify-center items-center z-50 sticky top-0 shadow-lg">
        <div class="flex items-center cursor-pointer">
            <i class="fa-solid fa-circle-play text-[#ccff00] text-[22px] mr-1.5 drop-shadow-[0_0_8px_rgba(204,255,0,0.8)]"></i>
            <div class="font-black text-[24px] tracking-widest leading-none mt-1" style="font-family: 'Comic Sans MS', cursive, sans-serif;">
                <span class="neon-blue-outline">PIKA</span><span class="neon-green-outline ml-[1px]">SHOW</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-3xl mx-auto p-4 md:p-6 z-10 flex flex-col mt-2">
        
        <!-- Video Player -->
        <div class="video-container mb-6">
            <video id="main-player" controls preload="metadata" poster="https://i.postimg.cc/Hkwyv5m9/upscalemedia-transformed.png">
                <source src="{{file_url}}" type="video/mp4">
            </video>
        </div>

        <!-- Details Panel -->
        <div class="bg-[#111]/90 backdrop-blur-sm border border-gray-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
            <!-- Top Gradient Line -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#00b4d8] to-[#ccff00]"></div>
            
            <!-- Badges -->
            <div class="flex items-center gap-2 mb-3 mt-1">
                <span class="bg-[#ccff00] text-black px-2.5 py-1 rounded text-[10px] font-black tracking-widest uppercase shadow-[0_0_10px_rgba(204,255,0,0.4)]"><i class="fa-solid fa-bolt text-[9px] mr-1"></i> Fast Stream</span>
                <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest">Premium</span>
            </div>

            <!-- Cleaned Title -->
            <h1 id="clean-title" class="text-[18px] md:text-[22px] font-black text-white leading-tight mb-6 tracking-wide break-words">
                {{file_name}}
            </h1>

            <!-- Direct Download Button -->
            <div class="grid grid-cols-1 gap-3">
                <button onclick="downloadAction()" class="w-full bg-[#ccff00] hover:bg-yellow-400 text-black font-black text-[14px] uppercase tracking-widest py-3.5 rounded-xl shadow-[0_0_20px_rgba(204,255,0,0.3)] transition-all flex justify-center items-center gap-2">
                    <i class="fa-solid fa-download text-lg"></i> Direct Download
                </button>
            </div>
        </div>

    </main>

    <!-- Core Scripts (Rewritten without Malicious Code) -->
    <script>
        const fileUrl = "{{file_url}}";

        // 1. Clean File Name (Removes dots, dashes, brackets)
        const titleEl = document.getElementById('clean-title');
        if (titleEl) {
            titleEl.innerText = titleEl.innerText
                .replace(/[._\-+]/g, ' ')
                .replace(/\[.*?\]/g, '')
                .replace(/\(.*?\)/g, '')
                .trim();
        }

        // 2. Video Player Error Handling & Timeout Validation
        const player = document.getElementById('main-player');
        if (player) {
            let bufferTimeout = setTimeout(() => {
                if (player.readyState < 3 && !player.paused) triggerError();
            }, 10000); // 10 seconds check

            player.onplaying = () => clearTimeout(bufferTimeout);
            player.onerror = () => { clearTimeout(bufferTimeout); triggerError(); };

            function triggerError() {
                if (!navigator.onLine) { alert('Please check your Internet Connection!'); return; }
                
                player.style.display = 'none';
                const errDiv = document.createElement('div');
                errDiv.className = 'absolute inset-0 flex flex-col items-center justify-center bg-[#111] border-2 border-dashed border-red-500/60 rounded-xl p-4 text-center';
                errDiv.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-3 drop-shadow-[0_0_10px_rgba(220,38,38,0.6)]"></i>
                    <h2 class="text-white font-bold text-[16px] mb-1 tracking-wide">Playback Issue</h2>
                    <p class="text-gray-400 text-[11px] mb-4">Slow network or unsupported video format.</p>
                    <button onclick="location.reload()" class="bg-white text-black px-6 py-2 rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-gray-200 transition shadow-md">Retry</button>
                `;
                player.parentNode.appendChild(errDiv);
            }

            // AC3/DTS Audio Check (Shows Warning if Audio codec is missing)
            player.onloadedmetadata = function() {
                if(player.canPlayType('audio/mp4; codecs="ec-3"') === '' && fileUrl.toLowerCase().includes('.mkv')) {
                    showAudioWarning();
                }
            };
        }

        // 3. Audio Warning UI (PikaShow Style)
        function showAudioWarning() {
            if(document.getElementById('audio-pop')) return;
            const pop = document.createElement('div');
            pop.id = 'audio-pop';
            pop.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 w-[90%] max-w-[350px] bg-[#0a0a0f]/95 border border-[#00b4d8] text-white p-3.5 rounded-xl z-50 flex items-center gap-3 shadow-[0_0_20px_rgba(0,180,216,0.3)] backdrop-blur-md';
            pop.innerHTML = `
                <div class="bg-red-500/20 w-8 h-8 rounded-full flex items-center justify-center shrink-0 border border-red-500/50">
                    <i class="fa-solid fa-volume-xmark text-red-500 text-sm"></i>
                </div>
                <div class="flex-1 text-[11px] font-medium leading-tight">Video might have no sound (AC3/DTS format). Download file to watch with audio.</div>
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white shrink-0 p-1"><i class="fa-solid fa-times text-lg"></i></button>
            `;
            document.body.appendChild(pop);
        }

        // 4. Download Action Function
        function downloadAction() {
            // Replaces /watch/ with /dl/ as per original code logic
            let currentUrl = window.location.href;
            if(currentUrl.includes('/watch/')) {
                window.location.href = currentUrl.replace('/watch/', '/dl/');
            } else {
                window.open(fileUrl, '_blank');
            }
        }
    </script>
</body>
</html>
